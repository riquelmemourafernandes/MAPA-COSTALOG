services:
  - type: web
    name: mapa-costalog-api
    runtime: node
    plan: free
    buildCommand: cd server && npm install --include=dev && npm run prisma:generate && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
