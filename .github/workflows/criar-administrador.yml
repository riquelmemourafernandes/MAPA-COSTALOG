name: Criar administrador inicial

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  criar-administrador:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências da API
        working-directory: server
        run: npm install

      - name: Gerar Prisma Client
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma generate --schema ../prisma/schema.prisma

      - name: Validar secrets obrigatórios
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          [ -n "$DATABASE_URL" ] || { echo "::error::Falta o secret DATABASE_URL."; exit 1; }
          [ -n "$ADMIN_NAME" ] || { echo "::error::Falta o secret ADMIN_NAME."; exit 1; }
          [ -n "$ADMIN_EMAIL" ] || { echo "::error::Falta o secret ADMIN_EMAIL."; exit 1; }
          [ -n "$ADMIN_PASSWORD" ] || { echo "::error::Falta o secret ADMIN_PASSWORD."; exit 1; }
          [ "${#ADMIN_PASSWORD}" -ge 8 ] || { echo "::error::ADMIN_PASSWORD precisa ter pelo menos 8 caracteres."; exit 1; }

      - name: Criar administrador inicial
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: npm run bootstrap:admin
